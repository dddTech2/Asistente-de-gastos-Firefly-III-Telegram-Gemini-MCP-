# Firefly III — stack base (historia 0.1)
#
# Dos servicios: la app de Firefly III y su base de datos (MariaDB), con un
# volumen nombrado persistente para los datos. HTTPS/reverse proxy se agrega
# en la historia 0.2; Redis/Postgres del Bot Service se agregan en la 0.3.
#
# Uso:
#   cp .env.example .env   # completar valores reales, nunca commitear .env
#   docker compose up -d
#
# Ver infra/README.md para instrucciones de instalación y generación de APP_KEY.

services:
  firefly-iii-db:
    image: mariadb:11
    container_name: firefly-iii-db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - firefly_iii_db:/var/lib/mysql
    networks:
      - firefly-iii-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  firefly-iii-app:
    image: fireflyiii/core:latest
    container_name: firefly-iii-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: firefly-iii-db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      TZ: ${TZ:-UTC}
    ports:
      - "${FIREFLY_HTTP_PORT:-8081}:8080"
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    depends_on:
      firefly-iii-db:
        condition: service_healthy
    networks:
      - firefly-iii-net

volumes:
  firefly_iii_db:
    name: firefly_iii_db
  firefly_iii_upload:
    name: firefly_iii_upload

networks:
  firefly-iii-net:
    name: firefly-iii-net
