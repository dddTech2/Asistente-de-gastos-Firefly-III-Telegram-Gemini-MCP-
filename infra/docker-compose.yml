# Firefly III — stack base (historia 0.1) + reverse proxy HTTPS (historia 0.2)
# + Postgres/Redis dedicados al Bot Service (historia 0.3)
#
# Servicios: la app de Firefly III y su base de datos (MariaDB); Postgres y
# Redis del Bot Service (base de datos y propósito completamente distintos —
# usuarios/PAT/auditoría, no datos financieros). El reverse proxy con HTTPS de
# la historia 0.2 NO vive acá: los puertos 80/443 de esta VPS ya los tiene el
# nginx del sistema operativo (usado por los demás proyectos del host).
# Firefly se expone agregando un server block más a ese nginx existente -- ver
# infra/README.md.
#
# Uso:
#   cp .env.example .env   # completar valores reales, nunca commitear .env
#   docker compose up -d
#
# Ver infra/README.md para instrucciones de instalación, generación de APP_KEY
# y configuración del reverse proxy del sistema + certificado.

services:
  firefly-iii-db:
    image: mariadb:11
    container_name: firefly-iii-db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - firefly_iii_db:/var/lib/mysql
    networks:
      - firefly-iii-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  firefly-iii-app:
    image: fireflyiii/core:latest
    container_name: firefly-iii-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: firefly-iii-db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      TZ: ${TZ:-UTC}
      # Sin esto, Laravel ignora el header X-Forwarded-Proto que manda el
      # nginx del host y genera URLs/redirects en HTTP aunque el usuario
      # entre por HTTPS. Seguro dejarlo en "**" (confiar en cualquier
      # proxy) porque el puerto solo es alcanzable desde 127.0.0.1 -- nada
      # externo puede pegarle directo al contenedor para falsear el header.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-**}
    # Publicado solo en localhost -- el nginx del sistema operativo (fuera de
    # este compose) es quien lo expone al público por HTTPS. Nunca publicar
    # en 0.0.0.0 acá: en esta VPS el puerto 80/443 público ya pertenece al
    # nginx del host, y exponer 8081 a 0.0.0.0 saltearía ese proxy y su TLS.
    ports:
      - "127.0.0.1:${FIREFLY_HTTP_PORT:-8081}:8080"
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    depends_on:
      firefly-iii-db:
        condition: service_healthy
    networks:
      - firefly-iii-net

  bot-postgres:
    image: postgres:16-alpine
    container_name: bot-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${BOT_DB_DATABASE}
      POSTGRES_USER: ${BOT_DB_USERNAME}
      POSTGRES_PASSWORD: ${BOT_DB_PASSWORD}
    volumes:
      - bot_postgres_data:/var/lib/postgresql/data
    # El Bot Service NO corre en este compose (es un proceso pm2 directo en el
    # host, historias 2.1+) -- necesita alcanzar este Postgres desde fuera de
    # Docker. Igual que Firefly en 0.1, se publica solo en 127.0.0.1: nunca en
    # 0.0.0.0 (AC #5 -- "no expuesto públicamente" no es lo mismo que "no
    # publicado", ver Dev Agent Record para el detalle de esta decisión).
    ports:
      - "127.0.0.1:${BOT_DB_PORT:-5433}:5432"
    networks:
      - firefly-iii-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOT_DB_USERNAME} -d ${BOT_DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot-redis:
    image: redis:7-alpine
    container_name: bot-redis
    restart: unless-stopped
    volumes:
      - bot_redis_data:/data
    # Mismo razonamiento que bot-postgres: publicado solo en 127.0.0.1 para
    # que el Bot Service (proceso host, no contenedor) pueda conectarse.
    ports:
      - "127.0.0.1:${BOT_REDIS_PORT:-6380}:6379"
    networks:
      - firefly-iii-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MCP de Firefly III (historia 4.1) -- segundo candidato, tras bloquear
  # @firefly-iii-mcp/server (ver decision-log.md y el Dev Agent Record de
  # 4.1). daften/fireflyiii-mcp SÍ implementa credenciales por-request de
  # verdad: en modo "PAT-only" (sin FIREFLY_OAUTH_CLIENT_ID) exige un header
  # `Authorization: Bearer <PAT>` en cada llamada y lo reenvía tal cual a
  # Firefly III -- verificado leyendo su código fuente (http.ts/client.ts/
  # index.ts: token resuelto por request vía AsyncLocalStorage, nunca un
  # valor fijo global), no solo su documentación.
  mcp-firefly:
    image: ghcr.io/daften/fireflyiii-mcp:0.4.6
    container_name: mcp-firefly
    restart: unless-stopped
    # Sin `command:` propio: el CMD por defecto de la imagen ya es
    # ["node", "dist/index.js", "--transport", "http", "--host", "0.0.0.0"]
    # (puerto 3000 por defecto) -- sobreescribirlo con solo los flags (sin
    # "node dist/index.js" delante) rompe el arranque, porque `command:`
    # reemplaza el CMD entero, no lo extiende.
    environment:
      # URL interna del contenedor de Firefly III en esta misma red Docker --
      # evita depender del dominio público/TLS para una llamada contenedor a
      # contenedor. Es la MISMA para todos los usuarios (una sola instancia
      # Firefly III, Épica 0); lo que varía por-usuario es el PAT, y ese NO
      # se fija acá -- viaja en el header Authorization de cada request
      # (ver mcp/README.md).
      FIREFLY_URL: ${MCP_FIREFLY_UPSTREAM_URL:-http://firefly-iii-app:8080}
      # Deliberadamente SIN FIREFLY_OAUTH_CLIENT_ID: su sola ausencia pone al
      # servidor en modo PAT-only (exige Bearer token por request, sin flujo
      # OAuth). Definirla lo cambiaría de modo.
    ports:
      - "127.0.0.1:${MCP_FIREFLY_PORT:-3100}:3000"
    depends_on:
      - firefly-iii-app
    networks:
      - firefly-iii-net

volumes:
  firefly_iii_db:
    name: firefly_iii_db
  firefly_iii_upload:
    name: firefly_iii_upload
  bot_postgres_data:
    name: bot_postgres_data
  bot_redis_data:
    name: bot_redis_data

networks:
  firefly-iii-net:
    name: firefly-iii-net
