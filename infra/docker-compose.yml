# Firefly III — stack base (historia 0.1) + reverse proxy HTTPS (historia 0.2)
#
# Servicios: la app de Firefly III y su base de datos (MariaDB). El reverse
# proxy con HTTPS de la historia 0.2 NO vive acá: los puertos 80/443 de esta
# VPS ya los tiene el nginx del sistema operativo (usado por los demás
# proyectos del host). Firefly se expone agregando un server block más a ese
# nginx existente -- ver infra/README.md.
#
# Uso:
#   cp .env.example .env   # completar valores reales, nunca commitear .env
#   docker compose up -d
#
# Ver infra/README.md para instrucciones de instalación, generación de APP_KEY
# y configuración del reverse proxy del sistema + certificado.

services:
  firefly-iii-db:
    image: mariadb:11
    container_name: firefly-iii-db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - firefly_iii_db:/var/lib/mysql
    networks:
      - firefly-iii-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  firefly-iii-app:
    image: fireflyiii/core:latest
    container_name: firefly-iii-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: firefly-iii-db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      TZ: ${TZ:-UTC}
      # Sin esto, Laravel ignora el header X-Forwarded-Proto que manda el
      # nginx del host y genera URLs/redirects en HTTP aunque el usuario
      # entre por HTTPS. Seguro dejarlo en "**" (confiar en cualquier
      # proxy) porque el puerto solo es alcanzable desde 127.0.0.1 -- nada
      # externo puede pegarle directo al contenedor para falsear el header.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-**}
    # Publicado solo en localhost -- el nginx del sistema operativo (fuera de
    # este compose) es quien lo expone al público por HTTPS. Nunca publicar
    # en 0.0.0.0 acá: en esta VPS el puerto 80/443 público ya pertenece al
    # nginx del host, y exponer 8081 a 0.0.0.0 saltearía ese proxy y su TLS.
    ports:
      - "127.0.0.1:${FIREFLY_HTTP_PORT:-8081}:8080"
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    depends_on:
      firefly-iii-db:
        condition: service_healthy
    networks:
      - firefly-iii-net

volumes:
  firefly_iii_db:
    name: firefly_iii_db
  firefly_iii_upload:
    name: firefly_iii_upload

networks:
  firefly-iii-net:
    name: firefly-iii-net
